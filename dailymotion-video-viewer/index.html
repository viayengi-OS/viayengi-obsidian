<!doctype html>
<html>

<head>
</head>

<body>

    <div id="container">
        <h5 id="noti"></h5>
        <!-- Remove the script tag from here -->
    </div>

    <script>
        // 1. Get parameters
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('id') || "k2Z5cnd1AJ0fh8I6vzk"; // Default ID if none provided
        const container = document.getElementById('container');
        const title = document.getElementById('noti');

        if (!params.get('id')) {
            title.textContent = "No ID Found. Playing default video.";
        }

        // 2. Create the script element dynamically
        const script = document.createElement('script');
        script.src = "https://geo.dailymotion.com/player/x164r2.js";
        script.setAttribute("data-video", videoId);

        // 3. Append it to the container
        container.appendChild(script);
    </script>

</body>

</html>
