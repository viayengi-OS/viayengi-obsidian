<!doctype html>
<html>

<head>
</head>
<div id="container">
  <h5 id="noti"></h5>
  <script id="dailymotion" src="https://geo.dailymotion.com/player/x164r2.js" data-video="k2Z5cnd1AJ0fh8I6vzk"></script>
</div>

<script>
  // 2.1 Get parameters
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get('id');
  const video = document.getElementById('dailymotion');
  const title = document.getElementById('noti');


  if (videoId) {
    video.setAttribute("data-video", videoId);
    title.textContent = "";
  } else {
    title.textContent = "No ID Founded. Play \"Sample Video\"";
  }
</script>
</body>

</html>
