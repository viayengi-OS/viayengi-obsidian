<!DOCTYPE html>
<html>
<head>
    <title>Viewer</title>
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- GitHub Markdown CSS (Dark) for beautiful rendering -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css" />
    
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; padding: 20px; }
        #container { max-width: 90vw; margin: 0 auto; }
        pre { border-radius: 8px; padding: 15px; overflow-x: auto; }
        
        /* Markdown container styling */
        .markdown-body {
            background-color: #1e1e1e !important;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="container">
    <h1 id="title">Loading...</h1>
    
    <!-- Raw Code View -->
    <pre id="code-container" style="display:none;"><code id="code-block" class="language-python"></code></pre>
    
    <!-- Markdown Render View -->
    <div id="markdown-viewer" class="markdown-body" style="display:none;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHzTc1_igN33hLOEKTXkHdaNDB8YRnumuKqVq-TYtYYo8DDXlryTmkKj9biGiJ986HwA/exec";
    
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get('id');
    const githubUrl = params.get('url');
    const ext = (params.get('ext') || 'md').toLowerCase();

    const codeContainer = document.getElementById('code-container');
    const codeBlock = document.getElementById('code-block');
    const markdownViewer = document.getElementById('markdown-viewer');
    const title = document.getElementById('title');

    // Logic to handle rendering
    function renderContent(content) {
        if (ext === 'md' || ext === "markdown") {
            // RENDER MARKDOWN
            title.innerText = "Markdown Preview";
            markdownViewer.style.display = 'block';
            markdownViewer.innerHTML = marked.parse(content);
        } else {
            // RENDER CODE
            title.innerText = "Code Viewer";
            codeContainer.style.display = 'block';
            
            // Set language for Prism
            const langMap = { 'js': 'javascript', 'py': 'python', 'html': 'html', 'css': 'css', 'json': 'json', 'java': 'java', 'cpp': 'cpp', 'c': 'c' };
            codeBlock.className = `language-${langMap[ext] || ext || "javascript"}`;
            Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/'; // Most IMPORTANT

            
            codeBlock.textContent = content;
            Prism.highlightElement(codeBlock);
        }
    }

    // Fetching Logic
    if (fileId) {
        fetch(`${SCRIPT_URL}?id=${fileId}`)
            .then(response => response.text())
            .then(data => renderContent(data))
            .catch(err => title.innerText = "Error: " + err);
    } else if (githubUrl) {
        fetch(githubUrl)
            .then(response => {
                if (!response.ok) throw new Error("Could not load file");
                return response.text();
            })
            .then(data => renderContent(data))
            .catch(err => title.innerText = "Error: " + err);
    } else {
        title.innerText = "Welcome";
        codeContainer.style.display = 'block';
        codeBlock.textContent = "Use ?id=DRIVE_ID or ?url=GITHUB_URL and optionally &ext=md";
    }
</script>

</body>
</html>
